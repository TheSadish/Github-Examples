name: Custom Env
on: [push]

env:
    my_name: Sadish

jobs:
    print_name:
        runs-on: ubuntu-latest
        steps:
            - name: Printing name
              run: echo "My name is $my_name"

            - name: Set var dynamically
              run: echo "NAME=Richa" >> $GITHUB_ENV

            - name: Print my friend
              run: echo "My friend is $NAME"
        
            
